# CI for gitops-api: test -> scan -> build (multi-arch) -> publish immutable image
# -> scan the published digest -> open a dev promotion PR in gitops-config.
#
# Security posture:
# * every third-party action pinned by commit SHA (comment = release tag)
# * scanners run as digest-pinned containers, not marketplace actions
# * default token is read-only; each job asks only for what it needs
# * the cross-repo credential (CONFIG_REPO_TOKEN, fine-grained PAT scoped to
#   gitops-config) is only exposed to the final job on main
# * no cluster credentials anywhere: Argo CD pulls from Git
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/dapravith/gitops-api
  TRIVY_IMAGE: aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
  HADOLINT_IMAGE: hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rust-toolchain.toml pins 1.99.0 + rustfmt + clippy; rustup installs it on first use.
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked

  scan-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans full history
          persist-credentials: false
      - name: Secret scan (gitleaks, full history)
        run: docker run --rm -v "$PWD:/repo:ro" "$GITLEAKS_IMAGE" git /repo --no-banner --redact --verbose --no-color
      - name: Dependency vulnerabilities (trivy, Cargo.lock)
        run: >-
          docker run --rm -v "$PWD:/src:ro" "$TRIVY_IMAGE"
          fs --quiet --scanners vuln --severity HIGH,CRITICAL --exit-code 1 /src/Cargo.lock
      - name: Dockerfile lint (hadolint)
        run: docker run --rm -i "$HADOLINT_IMAGE" hadolint - < Dockerfile

  image:
    needs: [test, scan-source]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write      # push to GHCR (main only)
      id-token: write      # keyless signing of the provenance attestation
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The tag is a human handle only. Deployments reference the DIGEST output.
      - name: Build (and push on main)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            VERSION=0.1.0
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan the published image (trivy, by digest)
        if: github.event_name != 'pull_request'
        run: >-
          docker run --rm "$TRIVY_IMAGE"
          image --quiet --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
          "${IMAGE}@${{ steps.build.outputs.digest }}"
      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Summary
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### Published"
            echo '```'
            echo "${IMAGE}@${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  promote-dev:
    needs: image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check credential
        id: cred
        env:
          TOKEN: ${{ secrets.CONFIG_REPO_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::CONFIG_REPO_TOKEN not set; image published but no dev promotion PR opened"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.cred.outputs.present == 'true'
        with:
          repository: Dapravith/gitops-config
          token: ${{ secrets.CONFIG_REPO_TOKEN }}
          path: gitops-config
      - name: Open dev promotion PR
        if: steps.cred.outputs.present == 'true'
        working-directory: gitops-config
        env:
          GH_TOKEN: ${{ secrets.CONFIG_REPO_TOKEN }}
          DIGEST: ${{ needs.image.outputs.digest }}
          IMAGE_REGISTRY: ghcr.io
          SHORT: ${{ github.sha }}
        run: |
          set -euo pipefail
          short="${SHORT:0:7}"
          branch="ci/dev-${short}"
          git config user.name "gitops-api-ci"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "${branch}"
          # Same script humans use: verifies the digest exists and is multi-arch.
          scripts/set-image.sh dev "${DIGEST}"
          if git diff --quiet; then echo "dev already on ${DIGEST}"; exit 0; fi
          git commit -am "ci(dev): gitops-api@${DIGEST:0:19} built from gitops-api@${short}

          Image: ghcr.io/dapravith/gitops-api@${DIGEST}
          Source: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}
          Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          git push origin "${branch}"
          url="$(gh pr create --base main --head "${branch}" \
            --title "ci(dev): gitops-api@${DIGEST:7:12} (${short})" \
            --body "Automated dev promotion from ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}.

          - Image: \`ghcr.io/dapravith/gitops-api@${DIGEST}\`
          - Built from: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}
          - Changes only \`apps/gitops-api/overlays/dev\`. Merges automatically once \`validate\` passes.")"
          # dev is the only environment that merges without a human.
          gh pr merge "${url}" --auto --merge
          echo "Opened ${url}" >> "$GITHUB_STEP_SUMMARY"
